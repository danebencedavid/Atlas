name: Build and Deploy Atlas

on:
  push:
    branches: [main, master]
  schedule:
    # The public report updates daily. Heavy 72-hour archives retain a true
    # three-day rhythm across month boundaries.
    #
    # 11:17 UTC, not earlier. The HungaroMet 10-minute export regenerates once a
    # day at about 09:50 UTC, and the file it publishes then covers through 23:50
    # UTC the previous day. Building at 05:15 read the *previous* day's file and so
    # always missed the final 22 hours of its own window: five consecutive editions
    # published with the headline day at 8% station coverage.
    #
    # The schedule is an optimisation, not the guarantee. The provider controls its
    # regeneration time and can move it without notice, so correctness rests on the
    # freshness assertion in the pipeline, which compares the newest observation
    # actually retrieved against the window end and refuses to publish if it falls
    # short. This cron only makes that assertion likely to pass on the first try.
    # Avoid the top-of-hour Actions scheduling surge, where delayed or dropped
    # schedule events are substantially more common.
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      archive_analysis: ${{ steps.check.outputs.archive_analysis }}
    steps:
      - name: Check heavy-analysis archive cadence
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "archive_analysis=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          epoch_day=$(($(date -u +%s) / 86400))
          if (( epoch_day % 3 == 0 )); then
            echo "archive_analysis=true" >> "$GITHUB_OUTPUT"
          else
            echo "archive_analysis=false" >> "$GITHUB_OUTPUT"
          fi

  verify-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Atlas
        run: python -m pip install -e ".[dev]"

      - name: Run tests without refreshing weather data
        run: pytest

  build:
    # Pushes validate source only. Refetching on the same UTC day can produce a
    # different capture for an already-frozen edition; only authoritative
    # scheduled/manual runs are allowed to publish weather data.
    if: github.event_name != 'push'
    needs: cadence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_artifact_id: ${{ steps.pages-artifact.outputs.artifact_id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Atlas
        run: python -m pip install -e ".[dev]"

      - name: Set reference-cache generation
        id: cache-date
        shell: bash
        run: echo "year=$(date -u +%Y)" >> "$GITHUB_OUTPUT"

      - name: Restore provider reference cache
        id: provider-cache
        uses: actions/cache/restore@v6
        with:
          path: data/raw/open_meteo_era5_daily_*.json
          key: atlas-provider-reference-v3-${{ runner.os }}-${{ steps.cache-date.outputs.year }}-bootstrap
          restore-keys: |
            atlas-provider-reference-v3-${{ runner.os }}-${{ steps.cache-date.outputs.year }}-
            atlas-provider-reference-v3-${{ runner.os }}-

      - name: Run tests
        run: pytest

      - name: Snapshot existing withheld notice
        id: withheld-before
        shell: bash
        run: |
          if [ -f reports/status/withheld.json ]; then
            echo "sha256=$(sha256sum reports/status/withheld.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          else
            echo "sha256=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static dashboard
        shell: bash
        run: |
          if [[ "${{ needs.cadence.outputs.archive_analysis }}" == "true" ]]; then
            atlas --refresh
          else
            atlas --refresh --skip-analysis-archive
          fi

      - name: Report a withheld build
        # A refusal to publish is correct but invisible: the deployment keeps
        # serving the previous edition. Surface it in the run summary so a failed
        # build is legible without opening the log, and commit the record so the
        # next published edition can carry the notice.
        if: failure()
        shell: bash
        run: |
          current_sha256=missing
          if [ -f reports/status/withheld.json ]; then
            current_sha256=$(sha256sum reports/status/withheld.json | cut -d ' ' -f 1)
          fi
          if [[ "$current_sha256" != "${{ steps.withheld-before.outputs.sha256 }}" && -f reports/status/withheld.json ]]; then
            {
              echo "## Edition withheld"
              echo ""
              echo "The build refused to publish because a publication-integrity gate"
              echo "failed. The previous edition remains deployed."
              echo ""
              echo '```json'
              cat reports/status/withheld.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports/status
            if ! git diff --cached --quiet; then
              git commit -m "Record withheld edition [skip ci]"
              git pull --rebase origin "${GITHUB_REF_NAME}"
              git push
            fi
          else
            {
              echo "## Build failed"
              echo ""
              echo "No new withheld-edition record was written. Any existing"
              echo "reports/status/withheld.json predates this run and is not its failure reason."
              echo "Open the failed build step for the current error."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Inspect reference-cache progress
        id: reference-state
        if: always()
        shell: bash
        run: |
          count=$(find data/raw -maxdepth 1 -name 'open_meteo_era5_daily_*.json' -type f | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Preserve provider cache progress
        if: always() && steps.reference-state.outputs.count != '0'
        uses: actions/cache/save@v6
        with:
          path: data/raw/open_meteo_era5_daily_*.json
          key: atlas-provider-reference-v3-${{ runner.os }}-${{ steps.cache-date.outputs.year }}-${{ hashFiles('data/raw/open_meteo_era5_daily_*.json') }}

      - name: Commit generated rolling report archive
        # Every successful refresh is authoritative. This prevents a push build
        # from deploying an edition that disappears from the next clean checkout.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily reports/periods
          # A successful build normally has no status record. Only stage the
          # optional file when it exists, or when a tracked copy was removed.
          if [ -f reports/status/withheld.json ]; then
            git add reports/status/withheld.json
          elif git ls-files --error-unmatch reports/status/withheld.json >/dev/null 2>&1; then
            git add -u -- reports/status/withheld.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Archive Atlas rolling report [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 90
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v9
        env:
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.pages_artifact_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const artifactId = Number(process.env.PAGES_ARTIFACT_ID)
            if (!Number.isSafeInteger(artifactId) || artifactId <= 0) {
              throw new Error(`Invalid Pages artifact ID: ${process.env.PAGES_ARTIFACT_ID}`)
            }

            const terminalFailures = new Set([
              'unknown_status',
              'deployment_failed',
              'deployment_perms_error',
              'deployment_content_failed',
              'deployment_cancelled',
              'deployment_lost',
            ])
            const retryableFailures = new Set(['deployment_failed'])
            const sleep = milliseconds =>
              new Promise(resolve => setTimeout(resolve, milliseconds))
            const maximumAttempts = 3
            const pollTimeout = 25 * 60 * 1000
            let pageUrl = ''

            for (let attempt = 1; attempt <= maximumAttempts; attempt += 1) {
              core.info(`Starting Pages deployment attempt ${attempt}/${maximumAttempts}`)
              let deployment
              try {
                const oidcToken = await core.getIDToken()
                const response = await github.request(
                  'POST /repos/{owner}/{repo}/pages/deployments',
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifactId,
                    pages_build_version: context.sha,
                    oidc_token: oidcToken,
                  },
                )
                deployment = response.data
              } catch (error) {
                if (attempt === maximumAttempts) {
                  throw error
                }
                core.warning(
                  `Could not create Pages deployment attempt ${attempt}: ${error.message}`,
                )
                await sleep(60000)
                continue
              }

              pageUrl = deployment.page_url || pageUrl
              const deploymentId =
                deployment.id ||
                deployment.status_url?.split('/').filter(Boolean).pop() ||
                context.sha
              core.setOutput('page_url', pageUrl)
              core.info(`Created Pages deployment ${deploymentId}`)

              const deadline = Date.now() + pollTimeout
              let lastStatus = ''
              let reportingErrors = 0
              let terminalStatus = ''

              while (Date.now() < deadline) {
                await sleep(10000)
                let status
                try {
                  const response = await github.request(
                    'GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}',
                    {
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      deploymentId,
                    },
                  )
                  status = response.data
                } catch (error) {
                  reportingErrors += 1
                  if (reportingErrors >= 12) {
                    throw error
                  }
                  core.warning(
                    `Pages status check ${reportingErrors}/12 failed: ${error.message}`,
                  )
                  continue
                }

                reportingErrors = 0
                if (status.status !== lastStatus) {
                  core.info(`Pages deployment status: ${status.status}`)
                  lastStatus = status.status
                }
                if (status.status === 'succeed') {
                  core.info(`Published Atlas at ${pageUrl}`)
                  return
                }
                if (terminalFailures.has(status.status)) {
                  terminalStatus = status.status
                  core.info(`Pages terminal payload: ${JSON.stringify(status)}`)
                  break
                }
              }

              if (!terminalStatus) {
                throw new Error(
                  `Pages deployment ${deploymentId} did not finish within 25 minutes; ` +
                    'the deployment was left active for GitHub to complete.',
                )
              }
              if (!retryableFailures.has(terminalStatus) || attempt === maximumAttempts) {
                throw new Error(`Pages deployment ended with status: ${terminalStatus}`)
              }

              core.warning(
                `Pages deployment attempt ${attempt} ended with ${terminalStatus}; ` +
                  'retrying the same artifact in 60 seconds.',
              )
              await sleep(60000)
            }
