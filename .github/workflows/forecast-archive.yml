name: Collect Forecast Archive

# Separate from the Pages workflow on purpose: this must not be able to affect
# the daily report or the site deployment. It only appends to the forecast
# archive, which Previous Runs cannot reconstruct after the fact because it keeps
# just seven daily offsets and no full run structure.

on:
  schedule:
    # Twice daily, a few hours after the main deterministic runs are published,
    # so a stalled provider does not collide with the Pages build at 05:15 UTC.
    - cron: "40 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Append-only storage: two writers would race on the same parquet files.
  group: forecast-archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Atlas
        run: python -m pip install -e ".[dev]"

      - name: Capture the forecast as issued
        run: atlas-forecast live

      - name: Commit the appended archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast_archive
          if ! git diff --cached --quiet; then
            git commit -m "Append issued forecast to archive [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
