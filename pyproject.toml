[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-weather-dashboard"
version = "0.3.0"
description = "Rolling weather anomaly, electricity, and renewable-energy dashboard for Debrecen, Hungary."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "Pillow>=10.0",
  "plotly>=5.22",
  "metpy>=1.6",
  "pvlib>=0.11",
  "PyYAML>=6.0",
  "requests>=2.31",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
