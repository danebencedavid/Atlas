[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-weather-dashboard"
version = "0.3.0"
description = "Rolling weather anomaly, electricity, and renewable-energy dashboard for Debrecen, Hungary."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "Pillow>=10.0",
  "plotly>=5.22",
  "metpy>=1.6",
  "pvlib>=0.11",
  "PyYAML>=6.0",
  # Floored at the version CI resolves to, not at the oldest that imports. CI
  # writes the forecast archive with pyarrow 25 and a local 19.0.0 could not read
  # it back: "Repetition level histogram size mismatch". The archive is the one
  # store that must survive a version gap between the writer and the reader.
  "pyarrow>=25.0",
  "requests>=2.31",
  "scipy>=1.11",
  # Used by atlas.forecast_mos. It had been running undeclared, resolved only
  # because it happened to be present in the development interpreter.
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
atlas = "atlas.cli:main"
atlas-forecast = "atlas.forecast_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
